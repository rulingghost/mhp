<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yönetim Paneli Girişi | MHP İstanbul</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Outfit', 'sans-serif'],
          },
          colors: {
            brand: {
              red: '#c0151a',
              darkRed: '#960f13',
              dark: '#0f172a',
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md">
    <!-- Card Container -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl backdrop-blur relative overflow-hidden">
      <!-- Top Decorative Accent -->
      <div class="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-red-600 via-red-500 to-amber-500"></div>

      <!-- Header & Logo -->
      <div class="text-center mb-8">
        <div class="inline-flex items-center justify-center w-20 h-20 rounded-full bg-red-950/60 border border-red-700/50 mb-4 p-3 shadow-inner">
          <img src="https://upload.wikimedia.org/wikipedia/commons/9/99/MHP_logo_Turkey.png" alt="MHP Logo" class="w-full h-full object-contain">
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-white">Yönetim Paneli</h1>
        <p class="text-sm text-slate-400 mt-1">İçerik düzenleme paneline erişmek için şifrenizi girin</p>
      </div>

      <!-- Alert Box -->
      <div id="alertBox" class="hidden mb-6 p-4 rounded-xl text-sm border"></div>

      <!-- Login Form -->
      <form id="loginForm" class="space-y-5">
        <div>
          <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-2">
            Yönetici Şifresi
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-slate-500">
              <i class="fas fa-lock"></i>
            </span>
            <input 
              type="password" 
              id="password" 
              name="password" 
              required 
              placeholder="••••••••" 
              class="w-full pl-10 pr-12 py-3 bg-slate-800/80 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-red-600 focus:border-transparent transition-all text-sm"
              autofocus
            >
            <button 
              type="button" 
              id="togglePassword" 
              class="absolute inset-y-0 right-0 flex items-center pr-3.5 text-slate-400 hover:text-white transition-colors"
              aria-label="Şifreyi Göster"
            >
              <i class="fas fa-eye" id="eyeIcon"></i>
            </button>
          </div>
        </div>

        <button 
          type="submit" 
          id="submitBtn" 
          class="w-full py-3.5 px-4 bg-red-600 hover:bg-red-700 active:scale-[0.99] text-white font-semibold rounded-xl shadow-lg shadow-red-900/40 hover:shadow-red-900/60 transition-all flex items-center justify-center space-x-2 text-sm"
        >
          <span id="btnText">Panele Giriş Yap</span>
          <i class="fas fa-arrow-right text-xs" id="btnIcon"></i>
          <i class="fas fa-spinner fa-spin hidden" id="btnSpinner"></i>
        </button>
      </form>

      <!-- Back to site link -->
      <div class="mt-8 text-center pt-4 border-t border-slate-800/80">
        <a href="/" class="text-xs text-slate-400 hover:text-white transition-colors inline-flex items-center space-x-1.5">
          <i class="fas fa-arrow-left text-[10px]"></i>
          <span>Web Sitesine Geri Dön</span>
        </a>
      </div>
    </div>
  </div>

  <script>
    // Password visibility toggle
    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('eyeIcon');

    togglePassword.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      eyeIcon.classList.toggle('fa-eye', !isPassword);
      eyeIcon.classList.toggle('fa-eye-slash', isPassword);
    });

    // Check if already authenticated
    const existingToken = localStorage.getItem('mhp_admin_token');
    if (existingToken) {
      fetch('/api/auth/check', {
        headers: { 'Authorization': `Bearer ${existingToken}` }
      })
      .then(res => res.json())
      .then(data => {
        if (data && data.authenticated) {
          window.location.href = '/admin';
        }
      })
      .catch(() => {});
    }

    // Handle form submit
    const form = document.getElementById('loginForm');
    const alertBox = document.getElementById('alertBox');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnIcon = document.getElementById('btnIcon');
    const btnSpinner = document.getElementById('btnSpinner');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const password = passwordInput.value.trim();
      if (!password) return;

      // Loading state
      submitBtn.disabled = true;
      btnText.textContent = 'Doğrulanıyor...';
      btnIcon.classList.add('hidden');
      btnSpinner.classList.remove('hidden');
      alertBox.classList.add('hidden');

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          localStorage.setItem('mhp_admin_token', data.token);
          alertBox.className = 'mb-6 p-4 rounded-xl text-sm border bg-emerald-950/60 border-emerald-700/60 text-emerald-300 flex items-center space-x-2';
          alertBox.innerHTML = '<i class="fas fa-check-circle text-base"></i><span>Giriş başarılı! Yönlendiriliyorsunuz...</span>';
          alertBox.classList.remove('hidden');

          setTimeout(() => {
            window.location.href = '/admin';
          }, 600);
        } else {
          alertBox.className = 'mb-6 p-4 rounded-xl text-sm border bg-red-950/60 border-red-700/60 text-red-300 flex items-center space-x-2';
          alertBox.innerHTML = `<i class="fas fa-exclamation-circle text-base"></i><span>${data.message || 'Hatalı şifre girdiniz.'}</span>`;
          alertBox.classList.remove('hidden');
          passwordInput.select();
        }
      } catch (err) {
        alertBox.className = 'mb-6 p-4 rounded-xl text-sm border bg-red-950/60 border-red-700/60 text-red-300 flex items-center space-x-2';
        alertBox.innerHTML = '<i class="fas fa-wifi text-base"></i><span>Sunucuya bağlanırken bir hata oluştu.</span>';
        alertBox.classList.remove('hidden');
      } finally {
        submitBtn.disabled = false;
        btnText.textContent = 'Panele Giriş Yap';
        btnIcon.classList.remove('hidden');
        btnSpinner.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
